name: Daily Funding Recruitment Watch

# 毎日 21:00 UTC = 翌日 06:00 JST に自動実行
# 手動実行も可能（Actions タブから Run workflow ボタン）
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

# リポジトリへの書き込み権限（差分DBのコミットに必要）
permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 公募情報を収集
        run: python watcher.py

      - name: メール通知（新規があれば送信）
        # Secrets が設定されている場合のみ実行
        if: ${{ env.SMTP_USER != '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python send_mail.py

      - name: Pages 用に output を docs/ にコピー
        run: |
          mkdir -p docs
          cp -r output/* docs/
          # ダッシュボードをトップページに
          cp output/dashboard.html docs/index.html

      - name: 差分・出力をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recruitment.db docs/ output/ || true
          git diff --cached --quiet || \
            git commit -m "chore: daily update $(date -u +%Y-%m-%d)"
          git push
